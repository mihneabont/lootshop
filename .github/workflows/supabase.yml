# Applies database migrations and deploys the Supabase functions and their
# secrets. Runs on pushes that touch supabase/, or by hand from the Actions tab.
# Needs the repository secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD.
# The others are optional.
name: Deploy Supabase

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: omivpopfugibfqnracan
    steps:
      - name: Check configuration
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Supabase secrets are not set yet; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.skip != 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: steps.check.outputs.skip != 'true'
        run: supabase link --project-ref "$PROJECT_REF"
      - if: steps.check.outputs.skip != 'true'
        run: supabase db push
      - if: steps.check.outputs.skip != 'true'
        name: Set function secrets
        run: |
          printf '%s\n' \
            "SITE_URL=https://mihneabont.github.io/lootshop" \
            "VAPID_PUBLIC_KEY=$(grep ^NEXT_PUBLIC_VAPID_PUBLIC_KEY= .env.production | cut -d= -f2)" \
            "VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}" \
            "VAPID_SUBJECT=mailto:${{ vars.CONTACT_EMAIL || 'contact@lootshop.ro' }}" \
            "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" \
            "EMAIL_FROM=${{ vars.EMAIL_FROM || 'Loot Shop <giveaway@lootshop.ro>' }}" \
            "EMAIL_REPLY_TO=${{ vars.CONTACT_EMAIL }}" \
            "WC_SITE_URL=${{ vars.WC_SITE_URL || 'https://lootshop.ro' }}" \
            "WC_CONSUMER_KEY=${{ secrets.WC_CONSUMER_KEY }}" \
            "WC_CONSUMER_SECRET=${{ secrets.WC_CONSUMER_SECRET }}" \
            | grep -v '=$' > secrets.env
          supabase secrets set --env-file secrets.env --project-ref "$PROJECT_REF"
          rm secrets.env
      - if: steps.check.outputs.skip != 'true'
        run: supabase functions deploy --project-ref "$PROJECT_REF"
